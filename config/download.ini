[daemon]
ipc_socket = /run/download/downloader.sock
log_level = info

[download]
download_dir = /backup/download
database = meta.db
max_concurrent_tasks = 3
# HTTP/FTP: additional attempts after a transient failure (0 disables retries).
max_retries = 3
# HTTP/FTP: connection timeout in seconds.
connect_timeout = 30
# HTTP/FTP: total seconds including retries/backoff; 0 disables this deadline.
transfer_timeout = 0
temp_suffix = .part
overwrite_policy = resume

[web]
enabled = true
listen = 0.0.0.0
port = 8000
