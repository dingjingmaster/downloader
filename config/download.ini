[daemon]
ipc_socket = /run/download/downloader.sock
log_level = info

[download]
download_dir = /backup/download
database = meta.db
max_concurrent_tasks = 5
# HTTP/FTP: additional attempts after a transient failure (0 disables retries).
max_retries = 3
# HTTP/FTP: connection timeout in seconds.
connect_timeout = 30
# HTTP/FTP: total seconds including retries/backoff; 0 disables this deadline.
transfer_timeout = 0
temp_suffix = .part
overwrite_policy = resume
# Optional AES-256 key path; empty derives "<database>.key" (created 0600).
secret_key_file =

[web]
enabled = true
listen = 0.0.0.0
port = 8000
# Remote access: set both to enable login sessions and CSRF protection.
# Terminate HTTPS in front of this HTTP listener and document the boundary.
username =
password =
session_seconds = 28800

[auth]
# Default named credential profile (see /api/auth-profiles) for tasks without one.
default_profile =

[proxy]
# Default named proxy profile (see /api/proxy-profiles) or raw fallback values.
default_profile =
url =
username =
password =

[baidu]
# Share files are transferred into this netdisk directory first: <dir>/<surl>.
transfer_directory = /downloader
# Parallel Baidu downloads; lower values reduce account risk-control.
max_parallel_tasks = 2
# Maximum files expanded from one directory/share.
max_files = 2000
# Seconds to reuse the /disk/home sign before refreshing it.
sign_cache_seconds = 3600
# Override only for testing or a domain migration.
api_base = https://pan.baidu.com
pcs_base = https://pcs.baidu.com
