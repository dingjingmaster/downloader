[daemon]
ipc_socket = /run/downloader/downloader.sock
log_level = info

[download]
download_dir = /var/lib/downloader/downloads
database = /var/lib/downloader/meta.db
max_concurrent_tasks = 5
# HTTP/FTP: additional attempts after a transient failure (0 disables retries).
max_retries = 3
# HTTP/FTP: connection timeout in seconds.
connect_timeout = 30
# HTTP/FTP: total seconds including retries/backoff; 0 disables this deadline.
transfer_timeout = 0
temp_suffix = .part
overwrite_policy = resume
# Optional AES-256 key path; empty derives "<database>.key" (created 0600).
secret_key_file =

[web]
enabled = true
listen = 127.0.0.1
port = 8000
# Remote access: set both to enable login sessions and CSRF protection.
# Terminate HTTPS in front of this HTTP listener and document the boundary.
username =
password =
session_seconds = 28800

[auth]
# Default named credential profile (see /api/auth-profiles) for tasks without one.
default_profile =

[proxy]
# Default named proxy profile (see /api/proxy-profiles) or raw fallback values.
default_profile =
url =
username =
password =
